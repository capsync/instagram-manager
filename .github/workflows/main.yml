name: Video Processing

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct .mp4 link to render"
        required: false

concurrency:
  group: video-processing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run video processing script
        working-directory: backend
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url || secrets.VIDEO_URL }}
          DOWNLOAD_DIR: ${{ github.workspace }}/downloads
          UPLOAD_DIR: ${{ github.workspace }}/output
          RENDER_PRESET: faster
          FFMPEG_THREADS: "2"
        run: node scripts/process-video.js

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: output/*.mp4
          retention-days: 2
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: rm -rf downloads output
